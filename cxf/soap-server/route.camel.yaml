- route:
    id: cxf-soap-server
    streamCache: false
    from:
      uri: cxf:bean:helloServer
      steps:
        - log:
            message: "Server received SOAP request"
        - setBody:
            constant:
              expression: >
                <sayHelloResponse xmlns="http://example.com/hello"><greeting>Hello from CXF server</greeting></sayHelloResponse>
        - log:
            message: "Server sending SOAP response"
- route:
    id: cxf-soap-test-caller
    from:
      uri: timer
      parameters:
        timerName: soap-caller
        repeatCount: 1
        delay: 5000
      steps:
        - setBody:
            constant:
              expression: >
                <sayHello xmlns="http://example.com/hello"><name>Forage</name></sayHello>
        - setHeader:
            name: operationName
            constant:
              expression: sayHello
        - setHeader:
            name: operationNamespace
            constant:
              expression: "http://example.com/hello"
        - to:
            uri: cxf:bean:helloClient
        - log:
            message: "Test caller received response: ${body}"
