- route:
    id: google
    description: This route uses an Agent that leverages Google Vertex
    from:
      uri: timer
      parameters:
        repeatCount: 1
        timerName: yaml
      steps:
        - setHeader:
            id: setHeader-9346
            expression:
              simple:
                expression: "1"
            name: CamelLangChain4jAgentMemoryId
        - setBody:
            simple: look up user 123 in the user database and return their details
        - to:
            id: to-1358
            uri: langchain4j-agent:google
            parameters:
              agent: "#foo"
              tags: users
        - log: ${body}
- route:
    id: ollama
    description: This route uses an Agent that leverages a locally hosted ollama
    from:
      uri: timer
      parameters:
        repeatCount: 1
        timerName: yaml
      steps:
        - setHeader:
            id: setHeader-9341
            expression:
              simple:
                expression: "1"
            name: CamelLangChain4jAgentMemoryId
        - setBody:
            simple: What is the timezone in Brasilia?
        - to:
            id: to-1359
            uri: langchain4j-agent:ollama
            parameters:
              agent: "#bar"
        - log: ${body}
- route:
    id: route-3369
    from:
      id: from-2978
      uri: ai-tool:userDb
      parameters:
        description: Query user database by user ID
        parameter.userId: string
        parameter.userId.description: The user ID to look up
        parameter.userId.required: true
        tags: users
      steps:
        - setBody:
            id: setBody-2153
            simple:
              expression: '{"name": "John Doe", "id": "123"}'
        - log:
            id: log-4263
            message: ${body}
