# Resolve the Forage snapshot artifacts.
camel.jbang.repos=https://central.sonatype.com/repository/maven-snapshots/

# Forage creates the default client bean named influxdb.
forage.influxdb.url=http://localhost:18086
forage.influxdb.username=writer
# Supply forage.influxdb.password through FORAGE_INFLUXDB_PASSWORD.
