- route:
    id: influxdb2-write
    from:
      uri: timer:write
      parameters:
        repeatCount: 1
        delay: 1000
      steps:
        - setBody:
            groovy: |
              com.influxdb.client.write.Point.measurement("temperature")
                  .addTag("sensor", "demo")
                  .addTag("room", "office")
                  .addField("value", 21)
        - to:
            uri: influxdb2:influxdb2
            parameters:
              org: acme
              bucket: metrics
              autoCreateOrg: false
              autoCreateBucket: false
        - log:
            message: "InfluxDB 2 point sent: temperature, sensor=demo, room=office, value=21"
